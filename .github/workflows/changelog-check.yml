name: Changelog check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [develop, v2]

jobs:
  changelog:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0            # need base ref to diff
      - name: Require a changelog entry
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          added=$(git diff --name-only --diff-filter=A \
            origin/${{ github.base_ref }}...HEAD -- '.changes/next-release/')
          if [ -z "$added" ]; then
            echo "::error::No changelog entry found. Run scripts/new-change (or add the skip-changelog label)."
            exit 1
          fi
          echo "Found: $added"
