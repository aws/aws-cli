# Pytest configuration for the opt-in `cargo xtask integ` step
# (tests/integ/run_integ_tests.py). It replaces upstream's
# [tool.pytest.ini_options]: those filters promote DeprecationWarnings to
# errors and are tuned to upstream's pinned dependency set, so under
# pytest 8 on Python 3.14 they fail on warnings unrelated to the binary
# under test. Only the marker declarations carry over.
[pytest]
markers =
    slow: marks tests as slow
    validates_models: marks tests as one which validates service models
